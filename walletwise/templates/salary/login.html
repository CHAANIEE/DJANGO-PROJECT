{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | WalletWise</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body class="auth-page">
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="auth-icon">💰</div>
      <h1 class="auth-title">WalletWise</h1>
      <p class="auth-sub">Sign in to your personal finance dashboard</p>
    </div>
    {% if form.errors %}
    <div class="alert alert-error"><i class="bi bi-exclamation-triangle-fill"></i> Invalid username or password.</div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <div class="field-group">
        <label class="field-label">Username</label>
        <div class="input-icon"><i class="bi bi-person"></i>
          <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus>
        </div>
      </div>
      <div class="field-group">
        <label class="field-label">Password</label>
        <div class="input-icon"><i class="bi bi-lock"></i>
          <input type="password" name="password" class="form-control" placeholder="Enter password" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-full mt-4">
        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
      </button>
    </form>
    <p class="auth-switch">Don't have an account? <a href="{% url 'register' %}">Create one</a></p>
  </div>
</div>
</body>
</html>
